name: crawl-pan-index
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
permissions:
  contents: write
concurrency:
  group: pan-index-updates
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: run crawler
        run: node crawl.mjs
      - name: commit index
        run: |
          git config user.name "pan-crawl-bot"
          git config user.email "pan-crawl-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "crawl $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push
